<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Categories | MakanNow</title>
<meta name="description" content="Add or delete MakanNow product categories.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Fariz Azim"><meta name="keywords" content="MakanNow, retort, ready to eat, rendang, cooking paste, sambal, inventory">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2220%22 y=%2220%22 width=%2260%22 height=%2260%22 fill=%22%23C62828%22 transform=%22rotate(45 50 50)%22/></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>document.documentElement.dataset.theme=document.documentElement.dataset.bsTheme=localStorage.getItem("theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
</head><body><header id="nav"></header>
<main class="container py-4">
  <div class="page-head"><h1 class="h3">Categories</h1><p id="count"></p></div>
  <div id="flash"></div>
  <section class="panel mb-4" aria-label="Add category">
    <h2 class="h5">Add category</h2>
    <div id="catMsg" class="alert d-none" role="alert"></div>
    <form id="catForm" class="row g-2 align-items-end" novalidate>
      <div class="col-md-9"><label class="form-label" for="cName">Category name</label><input id="cName" class="form-control" placeholder="e.g. Dessert Mix"></div>
      <div class="col-md-3"><button class="btn btn-tag w-100" type="submit">Add category</button></div>
    </form>
  </section>
  <section class="panel"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th>Colour</th><th>Category</th><th>Products</th><th>Action</th></tr></thead><tbody id="catBody"></tbody></table></div></section>
</main>

<!-- Edit category -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="editForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5" id="editTitle">Edit category</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <div id="editMsg" class="alert d-none" role="alert"></div><input type="hidden" id="eId">
    <div class="mb-3"><label class="form-label" for="eName">Category name</label><input id="eName" class="form-control"></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-tag">Save changes</button></div>
</form></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body></html>
