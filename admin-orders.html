<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Customer orders | MakanNow</title>
<meta name="description" content="All MakanNow customer orders with totals. The admin can update delivery status.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Fariz Azim"><meta name="keywords" content="MakanNow, retort, ready to eat, rendang, cooking paste, sambal, inventory">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2220%22 y=%2220%22 width=%2260%22 height=%2260%22 fill=%22%23C62828%22 transform=%22rotate(45 50 50)%22/></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>document.documentElement.dataset.theme=document.documentElement.dataset.bsTheme=localStorage.getItem("theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
</head><body><header id="nav"></header>
<main class="container py-4">
  <div class="page-head"><h1 class="h3">Customer orders</h1><p>Change the status as you pack and deliver. A tracking number is issued when an order goes out for delivery.</p></div>
  <div id="flash"></div>
  <section class="strip mb-4" aria-label="Order summary">
    <div><div class="lbl">Orders</div><div class="num" id="kOrders"></div><div class="sub" id="kOrdersSub"></div></div>
    <div><div class="lbl">Order value</div><div class="num" id="kRevenue"></div><div class="sub">excluding cancelled orders</div></div>
    <div><div class="lbl">To prepare</div><div class="num" id="kPrep"></div><div class="sub">waiting to be packed</div></div>
    <div><div class="lbl">Out for delivery</div><div class="num" id="kShip"></div><div class="sub">with a tracking number</div></div>
  </section>
  <section class="panel">
    <div class="row g-2 mb-3">
      <div class="col-md-7"><input id="search" class="form-control" placeholder="Search by customer or order number" aria-label="Search orders"></div>
      <div class="col-md-5"><select id="statusFilter" class="form-select" aria-label="Filter by status"><option value="">All statuses</option><option>Preparing</option><option>Out for delivery</option><option>Delivered</option><option>Cancelled</option></select></div>
    </div>
    <div class="table-responsive"><table class="table table-hover mb-0 table-stack"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Tracking no.</th><th class="c">Status</th></tr></thead><tbody id="orderBody"></tbody></table></div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/admin-orders.js"></script>
</body></html>
