<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Dashboard | MakanNow</title>
<meta name="description" content="Stock value, sales trend, best sellers and items to restock at MakanNow.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Fariz Azim"><meta name="keywords" content="MakanNow, retort, ready to eat, rendang, cooking paste, sambal, inventory">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2220%22 y=%2220%22 width=%2260%22 height=%2260%22 fill=%22%23C62828%22 transform=%22rotate(45 50 50)%22/></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>document.documentElement.dataset.theme=document.documentElement.dataset.bsTheme=localStorage.getItem("theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
</head><body><header id="nav"></header>
<main class="container py-4">
  <div class="page-head"><h1 class="h3">Dashboard</h1><p>How the shop is doing today.</p></div>
  <section class="strip mb-4" aria-label="Summary">
    <div><div class="lbl">Products</div><div class="num" id="kProducts"></div><div class="sub" id="kProductsSub"></div></div>
    <div><div class="lbl">Stock value</div><div class="num" id="kValue"></div><div class="sub" id="kValueSub"></div></div>
    <div><div class="lbl">Need restocking</div><div class="num neg" id="kLow"></div><div class="sub" id="kLowSub"></div></div>
    <div><div class="lbl">Open orders</div><div class="num" id="kOpen"></div><div class="sub" id="kOpenSub"></div></div>
  </section>
  <section class="row g-3 mb-4" aria-label="Sales charts">
    <div class="col-lg-8"><div class="panel"><h2 class="h5">Revenue by month</h2><div class="chart-box"><canvas id="salesChart"></canvas></div></div></div>
    <div class="col-lg-4"><div class="panel"><h2 class="h5">Revenue by category</h2><div class="chart-box"><canvas id="catChart"></canvas></div></div></div>
    <div class="col-lg-6"><div class="panel"><h2 class="h5">Best sellers (units)</h2><div class="chart-box"><canvas id="topChart"></canvas></div></div></div>
    <div class="col-lg-6"><div class="panel h-100"><div class="d-flex justify-content-between"><h2 class="h5">Restock soon</h2><a href="products.html" class="link">Manage products</a></div>
      <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Product</th><th>Stock / min</th><th class="c">Status</th></tr></thead><tbody id="restockBody"></tbody></table></div></div></div>
  </section>
  <section class="panel" aria-label="Latest customer orders">
    <div class="d-flex justify-content-between align-items-center"><h2 class="h5">Latest customer orders</h2><a href="admin-orders.html" class="link">Manage all orders</a></div>
    <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th class="c">Status</th></tr></thead><tbody id="latestOrders"></tbody></table></div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body></html>
